[package]
name = "portalproof_escrow"
version = "0.1.0"
edition = "2021"
authors = ["PortalProof Market Contributors"]
description = "Portaldot escrow contract for AI service delivery proofs."
license = "MIT"

[dependencies]
ink = { version = "5.0.0", default-features = false }
scale = { package = "parity-scale-codec", version = "3", default-features = false, features = ["derive"] }
scale-info = { version = "2", default-features = false, features = ["derive"], optional = true }

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = [
  "ink/std",
  "scale/std",
  "scale-info/std",
]
ink-as-dependency = []
