name: CI

on:
  push:
  pull_request:

jobs:
  frontend-and-contract-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Run project checks
        run: npm test

  contract-artifacts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Install cargo-contract
        run: cargo install cargo-contract --locked

      - name: Build contract artifacts
        working-directory: contracts/portalproof_escrow
        run: cargo contract build

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portalproof-escrow-contract
          path: contracts/portalproof_escrow/target/ink/
